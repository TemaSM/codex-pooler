name: Publish fork image 0.10.8

on:
  push:
    branches:
      - fork/publish-0.10.8
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image-0.10.8
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: codex-pooler-v0.10.8
      VERSION: 0.10.8
      EXPECTED_REVISION: d35508b9c39198932017a60dc68166a9be60a910
      IMAGE: ghcr.io/temasm/codex-pooler

    steps:
      - name: Checkout verified upstream release
        uses: actions/checkout@v7
        with:
          repository: icoretech/codex-pooler
          ref: refs/tags/codex-pooler-v0.10.8

      - name: Verify upstream release and Drone status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          revision=$(git rev-parse HEAD)
          if [[ "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "The upstream tag resolved to an unexpected revision."
            exit 1
          fi

          gh api "repos/icoretech/codex-pooler/releases/tags/${RELEASE_TAG}" > "${RUNNER_TEMP}/release.json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .prerelease == false' \
            "${RUNNER_TEMP}/release.json" >/dev/null

          gh api "repos/icoretech/codex-pooler/commits/${revision}/status" > "${RUNNER_TEMP}/status.json"
          jq -e \
            '[.statuses[] | select(.context == "continuous-integration/drone/push")][0].state == "success"' \
            "${RUNNER_TEMP}/status.json" >/dev/null

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish the verified release
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ghcr.io/temasm/codex-pooler:0.10.8
          labels: |
            org.opencontainers.image.title=Codex Pooler
            org.opencontainers.image.source=https://github.com/icoretech/codex-pooler
            org.opencontainers.image.revision=d35508b9c39198932017a60dc68166a9be60a910
            org.opencontainers.image.version=0.10.8
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify anonymous manifest access
        run: |
          set -euo pipefail

          docker logout ghcr.io
          docker manifest inspect "${IMAGE}:${VERSION}" > /dev/null
