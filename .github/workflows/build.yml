name: Build and publish

on:
  push:
    tags:
      - '*'
  status:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    if: github.event_name != 'status' || (github.event.context == 'continuous-integration/drone/push' && github.event.state == 'success')
    runs-on: ubuntu-latest
    concurrency:
      group: release-image-publication
      cancel-in-progress: false

    steps:
      - name: Checkout publication coordinator
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Select publication candidate
        id: trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/release-list.json"
          node scripts/verification/release-publish-trigger.mjs \
            "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH" "${RUNNER_TEMP}/release-list.json" "$GITHUB_OUTPUT"

      - name: Record deferred publication
        if: steps.trigger.outputs.publish != 'true'
        env:
          REASON: ${{ steps.trigger.outputs.reason }}
        run: |
          echo "Image publication deferred: ${REASON}"

      - name: Checkout release revision
        if: steps.trigger.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.trigger.outputs.release_tag }}

      - name: Verify checked-out revision
        if: steps.trigger.outputs.publish == 'true'
        id: revision
        env:
          EXPECTED_REVISION: ${{ steps.trigger.outputs.revision }}
        run: |
          set -euo pipefail

          revision=$(git rev-parse HEAD)
          if [[ "$revision" != "$EXPECTED_REVISION" ]]; then
            echo "Release tag resolved to an unexpected revision."
            exit 1
          fi
          echo "sha=$revision" >>"$GITHUB_OUTPUT"

      - name: Checkout publication policy
        if: steps.trigger.outputs.publish == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          path: .release-policy
          sparse-checkout: |
            scripts/verification/release-publish-guard.mjs
            scripts/verification/release-publish-trigger.mjs
            test/scripts/release_publish_guard_test.mjs
            test/scripts/release_publish_trigger_test.mjs
            test/scripts/support/registry_fetch_route.mjs
          sparse-checkout-cone-mode: false

      - name: Verify publication policy
        if: steps.trigger.outputs.publish == 'true'
        run: |
          node --test \
            .release-policy/test/scripts/release_publish_guard_test.mjs \
            .release-policy/test/scripts/release_publish_trigger_test.mjs

      - name: Require verified revision and select monotonic release aliases
        if: steps.trigger.outputs.publish == 'true'
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.trigger.outputs.release_tag }}
          REVISION: ${{ steps.revision.outputs.sha }}
        run: |
          set -euo pipefail

          gh api "repos/${GITHUB_REPOSITORY}/commits/${REVISION}/status" > "${RUNNER_TEMP}/release-status.json"
          ci_state=$(jq -r '[.statuses[] | select(.context == "continuous-integration/drone/push")][0].state // "missing"' "${RUNNER_TEMP}/release-status.json")
          if [[ "$ci_state" != "success" ]]; then
            {
              echo "ready=false"
              echo "reason=drone_${ci_state}"
            } >>"$GITHUB_OUTPUT"
            echo "Image publication deferred: Drone state is ${ci_state}."
            exit 0
          fi

          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/release-list.json"
          node .release-policy/scripts/verification/release-publish-guard.mjs \
            --registry "$RELEASE_TAG" "${RUNNER_TEMP}/registry-aliases.json"
          node .release-policy/scripts/verification/release-publish-guard.mjs \
            "$RELEASE_TAG" "$REVISION" "${RUNNER_TEMP}/release-status.json" \
            "${RUNNER_TEMP}/release-list.json" "${RUNNER_TEMP}/registry-aliases.json" "$GITHUB_OUTPUT"
          echo "ready=true" >>"$GITHUB_OUTPUT"

      - name: Record already published image
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published == 'true'
        run: echo "The immutable version tag already points to this release revision."

      - name: Set up QEMU
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published != 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata for Docker
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/icoretech/codex-pooler
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=Codex Pooler
            org.opencontainers.image.description=Managed pools of Codex accounts with OpenAI-compatible client routes
            org.opencontainers.image.source=https://github.com/icoretech/codex-pooler
            org.opencontainers.image.documentation=https://github.com/icoretech/codex-pooler/blob/main/README.md
            org.opencontainers.image.vendor=iCoreTech, Inc.
            org.opencontainers.image.revision=${{ steps.revision.outputs.sha }}
            org.opencontainers.image.version=${{ steps.publication.outputs.version }}
          tags: ${{ steps.publication.outputs.docker_tags }}

      - name: Login to GitHub Container Registry
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published != 'true'
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Prepare release assets
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published != 'true'
        env:
          RELEASE_TAG: ${{ steps.trigger.outputs.release_tag }}
          VERSION: ${{ steps.publication.outputs.version }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          asset_base="codex-pooler-self-host-${VERSION}"
          asset_dir="dist/${asset_base}"

          mkdir -p "${asset_dir}/scripts/self-host"
          cp README.md docker-compose.yml .env.example "${asset_dir}/"
          cp scripts/self-host/generate-env.sh "${asset_dir}/scripts/self-host/"

          tar -C dist -czf "dist/${asset_base}.tar.gz" "${asset_base}"

          (
            cd dist
            sha256sum "${asset_base}.tar.gz" > "${asset_base}.tar.gz.sha256"
          )

          digest_file="dist/codex-pooler-image-digests-${VERSION}.txt"
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "image_digest=${IMAGE_DIGEST}"
            echo
            echo "published_tags:"
            printf '%s\n' "${IMAGE_TAGS}"
          } > "${digest_file}"

      - name: Upload release assets
        if: steps.publication.outputs.ready == 'true' && steps.publication.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.trigger.outputs.release_tag }}
        run: |
          set -euo pipefail

          gh release upload "${RELEASE_TAG}" \
            dist/codex-pooler-self-host-*.tar.gz \
            dist/codex-pooler-self-host-*.tar.gz.sha256 \
            dist/codex-pooler-image-digests-*.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
